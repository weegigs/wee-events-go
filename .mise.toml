# Development environment for wee-events-go.
# Replaces the former Nix flake and direnv setup. Tools install with
# `mise install`; project tasks live in the justfile (`just <recipe>`).

[env]
# Load a local .env if present (replaces the former direnv dotenv hook).
# Missing file is tolerated.
_.file = [".env"]

[tools]
go = "1.26"
golangci-lint = "2.12.2"
just = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"go:github.com/nats-io/natscli/nats" = "latest"

# wire is declared as a go.mod `tool` directive — run it via `go tool wire`.
